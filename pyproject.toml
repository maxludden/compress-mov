[project]
name = "compress-mov"
version = "0.1.0"
description = "Batch-compress .mov files to HEVC .mp4 via ffmpeg, with a Finder Quick Action front end"
readme = "README.md"
authors = [
    { name = "Maxwell Ludden", email = "maxludden@me.com" }
]
requires-python = ">=3.11"
keywords = ["ffmpeg", "hevc", "video-compression", "finder-quick-action", "macos"]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
compress-mov = "compress_mov.cli:run"
compress-mov-tui = "compress_mov.tui:run"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    # So a plain `uv sync` can run the TUI tests; end users get it via the `tui` extra.
    "textual>=8.2.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters through call expressions in defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
